# On the USB stick: the system the installer copies is stored read-only on the stick
# (build-live-iso.sh); anything podman adds (NVIDIA's driver while installing) is kept in memory,
# since the stick's root filesystem can't hold container layers.
[storage]
driver = "overlay"
runroot = "/run/containers/storage"
graphroot = "/var/lib/containers/storage"

[storage.options]
additionalimagestores = ["/usr/lib/azrak-os/images"]
