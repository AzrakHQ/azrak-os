name: AzrakOS

# The OS images and the USB stick.
# - Images: ghcr.io/<owner>/azrak-os:minimal (Fedora bootc + Gamescope + the launcher, minimal/)
#   and :minimal-nvidia (the same plus NVIDIA's driver, nvidia/), and the Bazzite editions
#   :stable and :nvidia. Rebuilt daily so installed machines get their base's updates and the
#   newest launcher release; they update themselves from these tags.
# - USB stick (build-live-iso.sh): AzrakOS started from the stick, with its own installer and
#   the minimal edition stored on it. Installed PCs update themselves, so it's only rebuilt
#   (into a new release here) when the stick or the edition changes, or when asked.

on:
  workflow_dispatch:
    inputs:
      iso:
        description: Build the USB stick image into a new release
        type: boolean
        default: true
      test:
        description: "Test run: the minimal edition, its NVIDIA version and the USB stick, from this branch, under -test tags no PC uses; nothing is released"
        type: boolean
        default: false
      launcher:
        description: "A branch of AzrakHQ/azrak-launcher to build and bundle instead of its latest release (for test runs)"
        type: string
        default: ""
  # The stick or what it installs changed: a new USB stick image.
  push:
    branches: [main]
    paths: [build-live-iso.sh, "live/**", "minimal/**", "nvidia/**"]
  schedule:
    - cron: "30 5 * * *"

permissions:
  contents: write
  packages: write

concurrency:
  group: azrak-os${{ inputs.test && '-test' || '' }}
  cancel-in-progress: false

env:
  # Test runs push their images under -test tags (":minimal-test"), which no PC tracks.
  SUFFIX: ${{ inputs.test && '-test' || '' }}

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - tag: stable
            base: ghcr.io/ublue-os/bazzite-deck:stable
            file: Containerfile
          - tag: nvidia
            base: ghcr.io/ublue-os/bazzite-deck-nvidia:stable
            file: Containerfile
          - tag: minimal
            base: quay.io/fedora/fedora-bootc:44
            file: minimal/Containerfile
    steps:
      - uses: actions/checkout@v4

      - name: Test runs build the minimal edition only
        if: inputs.test && matrix.tag != 'minimal'
        run: echo "SKIP=1" >> "$GITHUB_ENV"

      - name: Free disk space (the base image is large)
        if: env.SKIP != '1'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Unpack the latest launcher release
        if: env.SKIP != '1' && inputs.launcher == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo AzrakHQ/azrak-launcher --pattern 'azrak-linux-x86_64.tar.gz*' --dir /tmp/release
          (cd /tmp/release && sha256sum -c azrak-linux-x86_64.tar.gz.sha256)
          tar -C /tmp/release -xzf /tmp/release/azrak-linux-x86_64.tar.gz
          mv /tmp/release/azrak-linux-x86_64 launcher
          launcher/azrak --version

      # Test runs can bundle a launcher that isn't released yet, built from its branch the way
      # its release workflow does (the release archive's other files come from the latest release).
      - uses: actions/checkout@v4
        if: env.SKIP != '1' && inputs.launcher != ''
        with:
          repository: AzrakHQ/azrak-launcher
          ref: ${{ inputs.launcher }}
          path: launcher-src
      - uses: dtolnay/rust-toolchain@stable
        if: env.SKIP != '1' && inputs.launcher != ''
      - name: Build the launcher from ${{ inputs.launcher }}
        if: env.SKIP != '1' && inputs.launcher != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq pkg-config libfontconfig1-dev libxkbcommon-dev >/dev/null
          (cd launcher-src && cargo build --release --locked)
          gh release download --repo AzrakHQ/azrak-launcher --pattern 'azrak-linux-x86_64.tar.gz' --dir /tmp/release
          tar -C /tmp/release -xzf /tmp/release/azrak-linux-x86_64.tar.gz
          mv /tmp/release/azrak-linux-x86_64 launcher
          cp launcher-src/target/release/azrak launcher/azrak
          cp launcher-src/install.sh launcher/install.sh
          rm -rf launcher-src
          launcher/azrak --version

      # The minimal edition runs the launcher in Gamescope, where a launcher that doesn't tag its
      # window shows nothing: publish it only with a release that does.
      - name: Does the released launcher run in Gamescope?
        if: matrix.tag == 'minimal' && env.SKIP != '1'
        run: |
          if ! launcher/azrak --supports gamescope; then
            echo "::notice:::minimal not published: the latest launcher release predates Gamescope support"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - name: Build
        if: env.SKIP != '1'
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/azrak-os" >> "$GITHUB_ENV"
          echo "TAG=${{ matrix.tag }}$SUFFIX" >> "$GITHUB_ENV"
          img="ghcr.io/$owner/azrak-os:${{ matrix.tag }}$SUFFIX"
          if [ "${{ matrix.tag }}" != minimal ]; then
            sudo podman build --pull=always --build-arg BASE_IMAGE=${{ matrix.base }} \
              --build-arg VERSION="$(date -u +%Y.%m.%d)" -f ${{ matrix.file }} -t "$img" .
            exit 0
          fi
          # The minimal edition builds its own base (bootc-base-imagectl needs these privileges),
          # then is split into one layer per package with every timestamp zeroed: a daily rebuild
          # then only changes the layers whose packages changed, and that's all a PC downloads.
          sudo podman build --pull=always --cap-add=all --security-opt=label=disable --device /dev/fuse \
            --build-arg BASE_IMAGE=${{ matrix.base }} --build-arg VERSION="$(date -u +%Y.%m.%d)" \
            -f ${{ matrix.file }} -t "$img-build" .
          sudo podman run --rm --privileged -v /var/lib/containers:/var/lib/containers ${{ matrix.base }} \
            /usr/libexec/bootc-base-imagectl rechunk "$img-build" "$img"
          sudo podman rmi "$img-build"

      - name: Check the image
        if: matrix.tag != 'minimal' && env.SKIP != '1'
        run: |
          img="$IMAGE:$TAG"
          sudo podman run --rm --entrypoint /usr/bin/bash "$img" -c '
            set -e
            test -x /usr/libexec/azrak-os/start
            test -x /usr/libexec/azrak-os/ensure-user
            systemctl is-enabled azrak-os-ensure-user.service bazzite-autologin.service
            test -f /etc/xdg/autostart/azrak-os.desktop
            test -f /etc/bazzite/desktop_autologin
            /usr/share/azrak-os/release/azrak --version
            for tool in xdotool mpv yt-dlp; do command -v "$tool" || { echo "missing $tool"; exit 1; }; done
            # Loaded at run time by name (trailers, archive installs).
            for lib in libmpv.so.2 libarchive.so.13; do ldconfig -p | grep -q "$lib " || { echo "missing $lib"; exit 1; }; done
            for f in /etc/xdg/autostart/org.kde.plasma-welcome.desktop /etc/xdg/autostart/steam.desktop \
                     /etc/xdg/autostart/bazzite-announcement.desktop /etc/skel/Desktop/Return.desktop; do
              test ! -e "$f" || { echo "should be gone: $f"; exit 1; }
            done
            grep -q kinoite /usr/share/ublue-os/image-info.json
            test -x /usr/libexec/bazzite-autologin'

      - name: Check the minimal image
        if: matrix.tag == 'minimal' && env.SKIP != '1'
        run: |
          sudo podman run --rm --entrypoint /usr/bin/bash "$IMAGE:$TAG" -c '
            set -e
            test -x /usr/libexec/azrak-os/session
            test -s /usr/lib/azrak-os/release
            systemctl is-enabled greetd.service NetworkManager.service bluetooth.service azrak-os-update.timer
            test "$(systemctl is-enabled bootc-fetch-apply-updates.timer)" = masked
            grep -q systemd.gpt_auto=0 /usr/lib/bootc/install/50-azrak-os.toml
            for tool in gamescope cage xprop xdotool nmcli bluetoothctl pactl rpm-ostree bootc; do
              command -v "$tool" >/dev/null || { echo "missing $tool"; exit 1; }
            done
            for lib in libmpv.so.2 libarchive.so.13 libxkbcommon-x11.so.0 libvulkan.so.1 libpulse.so.0 libXss.so.1; do
              ldconfig -p | grep -q "$lib " || { echo "missing $lib"; exit 1; }
            done
            /usr/share/azrak-os/release/azrak --version
            /usr/share/azrak-os/release/azrak --supports gamescope'

      - name: Push
        if: env.SKIP != '1'
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="$IMAGE:$TAG"
          refs="$img"
          # Dated tags keep earlier versions at hand (not for test runs).
          if [ -z "$SUFFIX" ]; then sudo podman tag "$img" "$img-$(date -u +%Y%m%d)"; refs="$refs $img-$(date -u +%Y%m%d)"; fi
          for ref in $refs; do
            for try in 1 2 3; do sudo podman push "$ref" && break; [ "$try" = 3 ] && exit 1; sleep 30; done
          done

      # The installer and installed machines pull without logging in, so a private package fails
      # every install ("unable to retrieve auth token ... unauthorized" in Anaconda). GitHub
      # creates packages private, and only the web settings page can change that.
      - name: Can anyone pull it?
        if: env.SKIP != '1'
        run: |
          if ! skopeo inspect --no-creds --raw "docker://$IMAGE:$TAG" >/dev/null; then
            echo "::error::$IMAGE:$TAG can't be pulled without logging in: make the package public at https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/azrak-os/settings (Danger Zone → Change visibility)"
            exit 1
          fi

  # NVIDIA's driver on top of the minimal edition just pushed, for its exact kernel: only the
  # driver's layers differ, so that's all an NVIDIA PC downloads.
  minimal-nvidia:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE=ghcr.io/$owner/azrak-os" >> "$GITHUB_ENV"
          core="ghcr.io/$owner/azrak-os:minimal$SUFFIX"
          sudo podman pull "$core"
          kernel=$(sudo podman run --rm "$core" rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-core)
          # Universal Blue builds the modules for each new Fedora kernel within about a day; until
          # then NVIDIA PCs keep the previous :minimal-nvidia.
          if ! skopeo inspect --raw "docker://ghcr.io/ublue-os/akmods-nvidia-lts:main-44-$kernel" >/dev/null; then
            echo "::notice::No NVIDIA modules for kernel $kernel yet: :minimal-nvidia stays as it is"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          sudo podman build --build-arg CORE="$core" --build-arg KERNEL="$kernel" -f nvidia/Containerfile \
            -t "ghcr.io/$owner/azrak-os:minimal-nvidia$SUFFIX" .

      - name: Check the image
        if: env.SKIP != '1'
        run: |
          sudo podman run --rm --entrypoint /usr/bin/bash "$IMAGE:minimal-nvidia$SUFFIX" -c '
            set -e
            kver=$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}" kernel-core)
            test "$(rpm -q --qf "%{VERSION}" kmod-nvidia)" = "$(rpm -q --qf "%{VERSION}" nvidia-driver)"
            find /usr/lib/modules/$kver -name "nvidia.ko*" | grep -q .
            grep -q nvidia-drm.modeset=1 /usr/lib/bootc/kargs.d/00-nvidia.toml
            ! grep -l "^enabled=1" /etc/yum.repos.d/*nvidia* 2>/dev/null
            /usr/share/azrak-os/release/azrak --version'

      - name: Push
        if: env.SKIP != '1'
        run: |
          echo "${{ github.token }}" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          img="$IMAGE:minimal-nvidia$SUFFIX"
          refs="$img"
          if [ -z "$SUFFIX" ]; then sudo podman tag "$img" "$img-$(date -u +%Y%m%d)"; refs="$refs $img-$(date -u +%Y%m%d)"; fi
          for ref in $refs; do
            for try in 1 2 3; do sudo podman push "$ref" && break; [ "$try" = 3 ] && exit 1; sleep 30; done
          done

      - name: Can anyone pull it?
        if: env.SKIP != '1'
        run: |
          if ! skopeo inspect --no-creds --raw "docker://$IMAGE:minimal-nvidia$SUFFIX" >/dev/null; then
            echo "::error::$IMAGE:minimal-nvidia$SUFFIX can't be pulled without logging in: make the package public at https://github.com/orgs/$GITHUB_REPOSITORY_OWNER/packages/container/azrak-os/settings (Danger Zone → Change visibility)"
            exit 1
          fi

  iso:
    needs: image
    # Only when the stick changed or when asked: installed PCs update themselves, so the stick
    # doesn't need rebuilding with every image update.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.iso)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift /usr/local/.ghcup /opt/microsoft || true
          df -h /

      - name: Build the USB stick image
        run: |
          owner=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          sudo podman pull "ghcr.io/$owner/azrak-os:minimal$SUFFIX"
          sudo podman run --rm --privileged --network host -v /var/lib/containers:/var/lib/containers -v "$PWD:/src" -w /src \
            -e CORE="ghcr.io/$owner/azrak-os:minimal$SUFFIX" -e WORK=/src/.iso-work quay.io/fedora/fedora-bootc:44 \
            ./build-live-iso.sh azrak-os-x86_64.iso
          sudo chown "$(id -u):$(id -g)" azrak-os-x86_64.iso
          sha256sum azrak-os-x86_64.iso > azrak-os-x86_64.iso.sha256
          size=$(stat -c %s azrak-os-x86_64.iso)
          echo "ISO: $size bytes"
          # GitHub releases take files up to 2 GiB.
          test "$size" -lt 2147483648

      # Test runs keep the stick as a workflow artifact (a few days) instead of releasing it.
      - name: Keep the test stick
        if: inputs.test
        uses: actions/upload-artifact@v4
        with:
          name: azrak-os-x86_64-test
          path: azrak-os-x86_64.iso*
          retention-days: 3
          compression-level: 0

      - name: Publish as a new release
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="installer-$(date -u +%Y.%m.%d-%H%M)"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "AzrakOS $(date -u +%Y-%m-%d)" \
            --notes "Download azrak-os-x86_64.iso and write it to a USB stick (see the README). Start the PC from it to try AzrakOS, then install it from the launcher. The installed PC keeps itself and the launcher up to date." \
            azrak-os-x86_64.iso azrak-os-x86_64.iso.sha256

      # One USB stick to download: the older ones (and the Fedora-installer ones before them) go,
      # once this one is published, so nobody picks an old one by mistake.
      - name: Remove the older USB sticks
        if: ${{ !inputs.test }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' |
            grep '^installer-' | grep -vxF "$current" | while read -r tag; do
              echo "Removing $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
